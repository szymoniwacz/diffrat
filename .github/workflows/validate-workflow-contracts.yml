name: Validate workflow contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.PRIVATE_SUBMODULE_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Materialize private AI workflow
        run: ./scripts/setup-ai-workflow.sh

      - name: Validate project workflow contracts
        run: python ci/validate-workflow-contracts.py --mode project

      - name: Run product tests
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q
