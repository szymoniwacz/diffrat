name: Validate workflow contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Load submodule deploy key
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.SUBMODULE_DEPLOY_KEY }}

      - name: Checkout private submodule
        run: |
          git config --global url."git@github.com:".insteadOf "https://github.com/"
          git submodule update --init --recursive .ai-template

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Materialize private AI workflow
        run: ./scripts/setup-ai-workflow.sh

      - name: Validate project workflow contracts
        run: python ci/validate-workflow-contracts.py --mode project

      - name: Run product tests
        run: |
          pip install -e ".[dev]"
          pytest tests/ -q
