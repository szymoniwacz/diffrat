name: Agent Goal
description: Authorize scoped AI-assisted work from a structured goal through a review-ready pull request.
title: "[Agent Goal]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the outcome you want. Do not provide file names, architecture, or an implementation plan.

        Leave the **Commands** section at the bottom as-is so it stays visible on the created issue. Agents ignore it for scope.

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome should this work achieve?
      placeholder: One clear goal statement.
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      description: How will you know the work is done?
      placeholder: Bullet list of observable outcomes.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Boundaries, dependencies, or non-negotiable limits.
      placeholder: Optional.

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Work that must not be included in this goal.
      placeholder: Optional.

  - type: textarea
    id: relevant_context
    attributes:
      label: Relevant context
      description: Links, prior decisions, or background the agent should read.
      placeholder: Optional.

  - type: textarea
    id: commands
    attributes:
      label: Commands
      description: Human cheat sheet only. Agents must ignore this section for scope. Comment exactly one option (repository owner).
      value: |
        REFERENCE ONLY — agents must ignore this entire section for scope, planning, implementation, validation, and Done.

        Comment exactly (repository owner):

        - `/execute-goal` — default: authorize work through a review-ready PR (human CR, then you merge)
        - `/execute-goal self-correcting-review` — same + self-correcting review mode when eligible (skip human CR; you still merge)
        - `/execute-goal self-correcting-review auto-merge` — same + Goal Executor squash-merges when eligible

        Authorizes branch, scoped changes, validation, commits, push, PR, CI stabilization, and handoff. Merge only with the `auto-merge` form when eligible.

        Details: `.ai/policies/autonomy-and-authorization.md`, `.ai/review/self-correcting-review-loop.md`
    validations:
      required: true
