name: Project Execution
description: Authorize sequential AI-assisted delivery of a product through small pull requests and manual merges.
title: "[Project Execution]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Describe the product outcome once. The Project Executor will select and execute one small goal at a time.

        Leave the **Commands** section at the bottom as-is so it stays visible on the created issue. Agents ignore it for scope.

  - type: textarea
    id: product_outcome
    attributes:
      label: Product outcome
      description: What complete product or milestone should exist?
      placeholder: Describe the observable end result, not an implementation plan.
    validations:
      required: true

  - type: textarea
    id: completion_criteria
    attributes:
      label: Completion criteria
      description: What measurable evidence proves the product outcome is complete?
      placeholder: Bullet list of observable product, quality, and documentation outcomes.
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Non-negotiable product, technical, security, privacy, cost, or delivery limits.
      placeholder: Optional.

  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
      description: Outcomes the Project Executor must not pursue.
      placeholder: Optional.

  - type: textarea
    id: relevant_context
    attributes:
      label: Relevant context
      description: Additional context not already recorded in the repository, such as external references or instructions specific to this execution.
      placeholder: Optional.

  - type: textarea
    id: commands
    attributes:
      label: Commands
      description: Human cheat sheet only. Agents must ignore this section for scope. Comment exactly one option (repository owner).
      value: |
        REFERENCE ONLY — agents must ignore this entire section for scope, planning, implementation, validation, and Done.

        Comment exactly (repository owner):

        - `/execute-project` — authorize project and start/resume (default: human CR per delegated PR, then you merge)
        - `/execute-project self-correcting-review` — same + self-correcting review mode on eligible delegated goals (skip human CR when eligible; you still merge)
        - `/execute-project self-correcting-review auto-merge` — same + Goal Executor squash-merges when eligible
        - `/continue-project` — optional nudge after material-decision answers or an unexpected stop (does not authorize by itself; ordinary post-merge CI resume uses the CI/workflow completed trigger)

        Merging a delegated PR continues the project when the merge and CI/workflow completed triggers are configured. Green post-merge CI advances; red CI repairs first. Project Executor never merges; Goal Executor may squash-merge only with `self-correcting-review auto-merge` when eligible.

        After editing the title or scope fields (Product outcome, Completion criteria, Constraints, Out of scope, Relevant context), re-comment `/execute-project`, `/execute-project self-correcting-review`, or `/execute-project self-correcting-review auto-merge` (authorization resets). Editing Commands alone does not reset authorization.

        Details: `.ai/policies/autonomy-and-authorization.md`, `.ai/review/self-correcting-review-loop.md`
    validations:
      required: true
